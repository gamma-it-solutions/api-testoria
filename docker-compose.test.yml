services:
  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testoria_test
      POSTGRES_USER: testoria
      POSTGRES_PASSWORD: testoria
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testoria -d testoria_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis_test:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  minio_test:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 10
