# Testoria API + S3 — host-level nginx vhost (owned by api-testoria).
# Deployed to /etc/nginx/sites-available/api.vhost.conf and symlinked into
# sites-enabled/. nginx runs on the host; api and minio are Docker containers
# published on 127.0.0.1 only.
#
# Cert: issued once on the host with
#   sudo certbot certonly --nginx \
#     -d api.testoria.gammait.net -d s3.testoria.gammait.net
# (live dir is named after the first -d domain: api.testoria.gammait.net)

# ─── HTTP: redirect to HTTPS ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.testoria.gammait.net s3.testoria.gammait.net;

    # Let certbot answer HTTP-01 challenges via the nginx plugin.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── shared TLS settings ──────────────────────────────────────────────
# (kept identical to the previous edge config)

# ─── HTTPS: API (api.testoria.gammait.net) ────────────────────────────
server {
    # HTTP/2 via the listen parameter (compatible with nginx < 1.25.1; the
    # standalone `http2 on;` directive is only valid on 1.25.1+).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.testoria.gammait.net;

    ssl_certificate     /etc/letsencrypt/live/api.testoria.gammait.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.testoria.gammait.net/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.testoria.gammait.net/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Uploads (attachments) post through the API; allow reasonable body size.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-ready (harmless for plain HTTP; needed if the API ever
        # proxies a WS endpoint). Centrifugo realtime through the edge is a
        # separate follow-up — centrifugo is not published on the host yet.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ─── HTTPS: MinIO / S3 (s3.testoria.gammait.net) ──────────────────────
# Public hostname embedded in attachment presigned URLs (api S3_PUBLIC_ENDPOINT_URL).
# Path-style addressing: https://s3.testoria.gammait.net/{bucket}/{key}.
# AWS SigV4 signs the Host header — `proxy_set_header Host $host;` is required;
# any rewrite returns 403 SignatureDoesNotMatch.
server {
    # HTTP/2 via the listen parameter (compatible with nginx < 1.25.1; the
    # standalone `http2 on;` directive is only valid on 1.25.1+).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name s3.testoria.gammait.net;

    ssl_certificate     /etc/letsencrypt/live/api.testoria.gammait.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.testoria.gammait.net/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.testoria.gammait.net/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Stream large objects without buffering to disk.
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 75s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
