name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, Type-check & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Type-check
        run: mypy app

      - name: Unit tests
        run: pytest tests/unit/ -q

  cli:
    name: CLI — Lint, Type-check & Unit Tests
    runs-on: ubuntu-latest
    # The CLI ships from this repo precisely so the client cannot drift from the
    # API it talks to — so it is checked on every backend PR, not on its own.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CLI
        working-directory: cli
        run: pip install -e '.[dev]'

      - name: Lint
        working-directory: cli
        run: ruff check testoria_cli tests

      - name: Type-check
        working-directory: cli
        run: mypy testoria_cli

      - name: Unit tests
        working-directory: cli
        run: pytest -q

      - name: Entry point is installed
        run: testoria --version

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: check

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testoria_test
          POSTGRES_USER: testoria
          POSTGRES_PASSWORD: testoria
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U testoria -d testoria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://testoria:testoria@localhost:5433/testoria_test
        run: alembic upgrade head

      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://testoria:testoria@localhost:5433/testoria_test
          TEST_REDIS_URL: redis://localhost:6380/0
          SECRET_KEY: ci-test-secret-key
        run: pytest tests/integration/ -q
