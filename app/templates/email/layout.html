<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Testoria{% endblock %}</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2329;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:8px;overflow:hidden;">
            <tr>
              <td style="background:#2563eb;padding:20px 32px;">
                <span style="color:#ffffff;font-size:20px;font-weight:bold;">Testoria</span>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;font-size:15px;line-height:1.6;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px;border-top:1px solid #eceef1;font-size:12px;color:#6b7280;">
                This is an automated message from Testoria. If you did not expect
                it you can safely ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
