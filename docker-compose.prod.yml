services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    restart: unless-stopped
    env_file: .env.prod
    # Published on loopback only — host nginx (api.testoria.gammait.net) is the
    # sole public entry point. Nothing reaches the API from the public interface.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      centrifugo:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: testoria
      POSTGRES_USER: testoria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testoria -d testoria"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal

  centrifugo:
    image: centrifugo/centrifugo:v5
    command: centrifugo -c config.json
    restart: unless-stopped
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    environment:
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET:?set CENTRIFUGO_TOKEN_SECRET}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?set CENTRIFUGO_API_KEY}
    depends_on:
      - redis
    networks:
      - internal

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    # Console on 9001 (loopback) for admin; 9000 (loopback) is reverse-proxied
    # publicly by host nginx as s3.testoria.gammait.net. The API still reaches
    # minio over the internal docker network (S3_ENDPOINT_URL=http://minio:9000).
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  minio_data:

networks:
  # Single private network for inter-service traffic (API ↔ DB/cache/realtime/
  # object store). The public edge is host-level nginx, so there is no longer a
  # shared `proxy` docker network and no cross-repo network ownership.
  internal:
